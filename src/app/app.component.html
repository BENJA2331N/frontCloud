<div class="app-layout">
  <!-- Barra de navegación superior siempre visible -->
  <nav class="app-navbar">
    <div class="navbar-left">
      <a routerLink="/dashboard" class="brand-link">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span class="brand-text">Pedidos360 <span class="cloud-tag">Cloud</span></span>
      </a>

      <div class="nav-links">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Dashboard</a>
        <a routerLink="/catalog" routerLinkActive="active" class="nav-item">Catálogo</a>
        <a *ngIf="authService.isLoggedIn()" routerLink="/orders" routerLinkActive="active" class="nav-item">Pedidos</a>
      </div>
    </div>

    <div class="navbar-right">
      <!-- Selector de Rol para Demostración / Pruebas Rápidas -->
      <div *ngIf="authService.isLoggedIn()" class="role-selector-box">
        <span class="selector-label">Rol activo:</span>
        <select 
          class="role-select" 
          [value]="authService.getSimulatedRole() || (authService.isAdmin() ? 'ADMIN' : (authService.isOperador() ? 'OPERADOR' : 'CLIENTE'))"
          (change)="onRoleChange($event)">
          <option value="ADMIN">🛡️ ADMIN</option>
          <option value="OPERADOR">⚡ OPERADOR</option>
          <option value="CLIENTE">🛒 CLIENTE</option>
        </select>
      </div>

      <!-- Usuario Autenticado -->
      <div *ngIf="authService.isLoggedIn()" class="user-chip">
        <div class="user-avatar-mini" [ngClass]="{
          'avatar-admin': authService.isAdmin(),
          'avatar-operador': authService.isOperador(),
          'avatar-cliente': !authService.isAdmin() && !authService.isOperador()
        }">{{ authService.getUserName().charAt(0).toUpperCase() }}</div>
        <div class="user-meta">
          <span class="nav-username">{{ authService.getUserName() }}</span>
          <span class="nav-role" [ngClass]="{
            'role-admin': authService.isAdmin(),
            'role-operador': authService.isOperador(),
            'role-cliente': !authService.isAdmin() && !authService.isOperador()
          }">
            {{ authService.isAdmin() ? 'ADMIN' : (authService.isOperador() ? 'OPERADOR' : 'CLIENTE') }}
          </span>
        </div>
      </div>
      <button *ngIf="authService.isLoggedIn()" (click)="authService.logout()" class="btn-logout" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Salir</span>
      </button>

      <!-- Usuario No Autenticado (Invitado / Cliente Público) -->
      <div *ngIf="!authService.isLoggedIn()" class="guest-chip">
        <span class="guest-badge">👤 Cliente (Invitado)</span>
      </div>
      <button *ngIf="!authService.isLoggedIn()" (click)="authService.login()" class="btn-login-nav">
        <svg class="ms-nav-icon" viewBox="0 0 21 21" width="16" height="16">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        <span>Iniciar Sesión (Admin / Operador)</span>
      </button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
